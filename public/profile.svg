<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5B4C"/>
      <stop offset="100%" stop-color="#6F4234"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Suit Body -->
  <path d="M 120 600 L 220 380 L 300 440 L 380 380 L 480 600 Z" fill="url(#suit)"/>
  
  <!-- White Dress Shirt -->
  <polygon points="260,370 300,440 340,370 320,350 280,350" fill="#FFFFFF"/>
  
  <!-- Black Necktie -->
  <polygon points="290,375 310,375 315,460 300,480 285,460" fill="#000000"/>
  
  <!-- Shirt Collar -->
  <polygon points="245,350 280,370 295,350" fill="#F4F4F5"/>
  <polygon points="355,350 320,370 305,350" fill="#E4E4E7"/>
  
  <!-- Suit Lapels -->
  <polygon points="170,600 230,380 270,440 210,600" fill="#27272A"/>
  <polygon points="430,600 370,380 330,440 390,600" fill="#18181B"/>
  
  <!-- Neck -->
  <rect x="260" y="290" width="80" height="80" rx="10" fill="url(#skin)"/>
  
  <!-- Head & Face -->
  <ellipse cx="300" cy="230" rx="95" ry="115" fill="url(#skin)"/>
  
  <!-- Dark Curly Hair -->
  <path d="M 195 210 C 190 130, 240 80, 300 80 C 360 80, 410 130, 405 210 C 390 130, 360 100, 300 100 C 240 100, 210 130, 195 210 Z" fill="#0C0A09"/>
  <circle cx="230" cy="110" r="25" fill="#0C0A09"/>
  <circle cx="270" cy="95" r="30" fill="#0C0A09"/>
  <circle cx="310" cy="90" r="32" fill="#0C0A09"/>
  <circle cx="350" cy="100" r="28" fill="#0C0A09"/>
  <circle cx="380" cy="120" r="24" fill="#0C0A09"/>

  <!-- Eyes & Eyebrows -->
  <path d="M 240 190 Q 260 182 275 190" stroke="#0C0A09" stroke-width="5" fill="none"/>
  <path d="M 325 190 Q 340 182 360 190" stroke="#0C0A09" stroke-width="5" fill="none"/>
  <circle cx="258" cy="205" r="7" fill="#1C1917"/>
  <circle cx="342" cy="205" r="7" fill="#1C1917"/>
  
  <!-- Nose -->
  <path d="M 300 200 L 295 235 L 308 237" stroke="#522E24" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Beard & Mustache -->
  <path d="M 220 230 C 210 310, 250 340, 300 340 C 350 340, 390 310, 380 230 C 360 310, 340 330, 300 330 C 260 330, 240 310, 220 230 Z" fill="#0C0A09" opacity="0.95"/>
  <path d="M 255 250 Q 300 240 345 250 Q 300 268 255 250 Z" fill="#0C0A09"/>
  
  <!-- Warm Gentle Smile -->
  <path d="M 265 268 Q 300 290 335 268" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>